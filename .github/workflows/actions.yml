name: Matrix Build 26028f5

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }} - Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: matrix-26028f5
        run: echo "Building on ${{ matrix.os }} with Python ${{ matrix.python }}"

      - name: Generate build artifact
        run: |
          echo "Build artifact from OS=${{ matrix.os }} PY=${{ matrix.python }}" > artifact-${{ matrix.os }}-${{ matrix.python }}.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-26028f5-${{ matrix.os }}-${{ matrix.python }}
          path: artifact-${{ matrix.os }}-${{ matrix.python }}.txt
